<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>·</title>
<style>
  :root { --void:#07040f; --water:#7fd6ff; --glow:#b48cff; --text:#e6dcff; --muted:#8f84a8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: radial-gradient(ellipse at 50% 35%, #1d1035 0%, var(--void) 70%) fixed; color: var(--text);
         font-family: "Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
         display: flex; flex-direction: column; align-items: center; gap: 14px; min-height: 100vh; padding: 18px 16px 32px; }
  nav { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  nav button { background: transparent; color: var(--muted); border: 1px solid #3a2a5c; border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
  nav button.on { color: var(--text); border-color: var(--glow); background: rgba(108,63,196,.25); box-shadow: 0 0 10px rgba(180,140,255,.3); }
  canvas { width: min(640px, 100%); aspect-ratio: 1; display: block; border-radius: 6px; touch-action: none;
           clip-path: polygon(2% 1%,40% 0,62% 2%,98% 0,100% 35%,98% 70%,100% 99%,60% 100%,30% 98%,0 100%,1% 60%,0 25%); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
  button.act { background: #1c1430; color: var(--text); border: 1px solid #4a3a72; border-radius: 8px; padding: 9px 14px; font-size: 14px; cursor: pointer; min-width: 44px; }
  button.act:hover { border-color: var(--glow); box-shadow: 0 0 8px rgba(180,140,255,.35); }
  button.save { background: linear-gradient(180deg,#5b3aa8,#3b2378); border-color: #8f6be0; color: #f1eaff; }
  .pad { display: grid; grid-template-columns: repeat(3, 46px); gap: 4px; }
  .pad button { padding: 8px 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<nav id="nav" style="display:none"></nav>
<canvas id="cv" width="640" height="640"></canvas>
<div class="row" id="ctrl"></div>
<div class="row"><button class="act save" onclick="save()">이미지로 저장</button></div>

<script>
/* ─────────────────────────── 공통 ─────────────────────────── */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const SZ = 640, DPR = Math.min(2, window.devicePixelRatio || 1);
cv.width = SZ * DPR; cv.height = SZ * DPR; ctx.scale(DPR, DPR);
const WATER = '#7fd6ff', GLOW = '#b48cff';

// 배경(파편) 미리 그려 두기 — 고정 시드
const bgCanvas = document.createElement('canvas'); bgCanvas.width = SZ; bgCanvas.height = SZ;
(function () {
  const g = bgCanvas.getContext('2d'); let s = 7; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const bg = g.createRadialGradient(SZ / 2, SZ * .4, 30, SZ / 2, SZ * .4, SZ * .8);
  bg.addColorStop(0, '#1d1035'); bg.addColorStop(1, '#07040f'); g.fillStyle = bg; g.fillRect(0, 0, SZ, SZ);
  for (let i = 0; i < 16; i++) {
    g.save(); g.translate(rnd() * SZ, rnd() * SZ); g.rotate(rnd() * 6.28); const w = 10 + rnd() * 40;
    g.fillStyle = 'rgba(43,29,72,.55)'; g.strokeStyle = 'rgba(58,42,92,.8)';
    g.beginPath(); g.moveTo(0, 0); g.lineTo(w, w * .2); g.lineTo(w * .8, w); g.lineTo(0, w * .7); g.closePath(); g.fill(); g.stroke(); g.restore();
  }
  g.strokeStyle = 'rgba(61,44,99,.6)'; g.lineWidth = 1;
  for (let i = 0; i < 6; i++) { g.beginPath(); const x = rnd() * SZ, y = rnd() * SZ; g.moveTo(x, y); g.lineTo(x + (rnd() - .5) * 120, y + (rnd() - .5) * 120); g.stroke(); }
})();
function drawBG() { ctx.drawImage(bgCanvas, 0, 0); }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function stone(x, y, w, h, lit) {
  rr(x, y, w, h, 8); const g = ctx.createLinearGradient(x, y, x + w, y + h);
  g.addColorStop(0, '#3b3150'); g.addColorStop(.6, '#2a2238'); g.addColorStop(1, '#1d1729'); ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = lit ? WATER : '#4a3c66'; ctx.lineWidth = lit ? 2.5 : 1.2; ctx.stroke();
}
function pt(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * SZ, y: (e.clientY - r.top) / r.height * SZ }; }
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

/* ─────────────────────── ⑤ 같은 박자 ─────────────────────── */
const Pulse = (() => {
  const K = 5, START_LEN = 3, GOAL_LEN = 7;
  const POS = [...Array(K).keys()].map(i => { const a = -Math.PI / 2 + 2 * Math.PI * i / K; return { x: 320 + 200 * Math.cos(a), y: 330 + 200 * Math.sin(a) }; });
  let seq = [], len, input, mode, lit = {}, solved = false, timers = [], fail = 0;
  function clear() { timers.forEach(clearTimeout); timers = []; }
  function newSeq() { seq = []; for (let i = 0; i < GOAL_LEN; i++) seq.push(Math.floor(Math.random() * K)); }
  function reset() { clear(); newSeq(); len = START_LEN; input = 0; mode = 'idle'; solved = false; lit = {}; fail = 0; }
  function flash(i, ms) { lit[i] = performance.now() + ms; }
  function play() {
    clear(); mode = 'show'; input = 0; let tt = 700;
    timers.push(setTimeout(() => { lit.core = performance.now() + 300; }, 200));
    for (let k = 0; k < len; k++) { const i = seq[k]; timers.push(setTimeout(() => flash(i, 420), tt)); tt += 650; }
    timers.push(setTimeout(() => { mode = 'input'; }, tt));
  }
  function start() { if (mode === 'show') return; if (solved || mode === 'idle' || mode === 'fail') { reset(); } play(); }
  function down(e) {
    if (mode !== 'input') return; const q = pt(e);
    const i = POS.findIndex(p => Math.hypot(p.x - q.x, p.y - q.y) < 46); if (i < 0) return;
    flash(i, 250);
    if (seq[input] !== i) { mode = 'fail'; fail = performance.now(); clear(); return; }
    input++;
    if (input >= len) {
      if (len >= GOAL_LEN) { solved = true; mode = 'done'; return; }
      len++; mode = 'wait'; timers.push(setTimeout(play, 900));
    }
  }
  function crystal(x, y, on, r = 40) {
    ctx.save(); ctx.translate(x, y);
    ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(r * .55, -r * .2); ctx.lineTo(r * .4, r * .7); ctx.lineTo(-r * .4, r * .7); ctx.lineTo(-r * .55, -r * .2); ctx.closePath();
    const g = ctx.createLinearGradient(0, -r, 0, r); g.addColorStop(0, on ? '#f3eaff' : '#7a55d0'); g.addColorStop(1, on ? '#b48cff' : '#2b1a52');
    ctx.fillStyle = g; ctx.shadowColor = on ? (solved ? WATER : GLOW) : 'transparent'; ctx.shadowBlur = on ? 30 : 0; ctx.fill();
    ctx.strokeStyle = solved ? WATER : '#9b7be0'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore();
  }
  function draw(t) {
    const now = performance.now(); drawBG();
    // 빛줄기
    POS.forEach((p, i) => { ctx.beginPath(); ctx.moveTo(320, 330); ctx.lineTo(p.x, p.y); ctx.strokeStyle = solved ? 'rgba(127,214,255,.6)' : (lit[i] > now ? 'rgba(220,190,255,.8)' : 'rgba(108,63,196,.35)'); ctx.lineWidth = lit[i] > now ? 3 : 1.5; ctx.stroke(); });
    // 핵
    const beat = (lit.core > now ? 1.25 : 1) * (1 + .05 * Math.sin(t / 250));
    ctx.save(); ctx.translate(320, 330); ctx.scale(beat, beat);
    const g = ctx.createRadialGradient(0, 0, 4, 0, 0, 52); g.addColorStop(0, solved ? '#e8fbff' : '#e9dcff'); g.addColorStop(1, solved ? '#1c5b84' : '#3a1f6e');
    ctx.beginPath(); for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; ctx.lineTo(48 * Math.cos(a), 48 * Math.sin(a)); } ctx.closePath();
    ctx.fillStyle = g; ctx.shadowColor = solved ? WATER : GLOW; ctx.shadowBlur = 24; ctx.fill(); ctx.restore(); ctx.shadowBlur = 0;
    POS.forEach((p, i) => crystal(p.x, p.y, solved || lit[i] > now));
    // 진행 (작은 빛 알갱이)
    for (let k = 0; k < GOAL_LEN - START_LEN + 1; k++) {
      const x = 320 + (k - 2) * 22, y = 590, on = solved || k < len - START_LEN || (mode === 'input' && k === len - START_LEN && false);
      ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fillStyle = on ? (solved ? WATER : GLOW) : 'rgba(108,63,196,.3)'; ctx.fill();
    }
    if (mode === 'fail') { const k = Math.min(1, (now - fail) / 600); ctx.fillStyle = `rgba(0,0,0,${.35 * (1 - k * .3)})`; ctx.fillRect(0, 0, SZ, SZ); }
    if (solved) { ctx.fillStyle = 'rgba(127,214,255,.06)'; ctx.fillRect(0, 0, SZ, SZ); }
  }
  reset();
  return { name: '박동', file: 'pulse', draw, down, controls: () => [btn('▶', start)], leave: clear };
})();

/* ─────────────────────────── 틀 ─────────────────────────── */
const PUZZLES = [Pulse];
let cur = 0;
function btn(label, fn) { const b = document.createElement('button'); b.className = 'act'; b.textContent = label; b.onclick = fn; return b; }
function select(i) {
  if (PUZZLES[cur].leave) PUZZLES[cur].leave();
  cur = i;
  document.querySelectorAll('nav button').forEach((b, k) => b.classList.toggle('on', k === i));
  const ctrl = document.getElementById('ctrl'); ctrl.innerHTML = ''; PUZZLES[i].controls().forEach(el => ctrl.appendChild(el));
}
PUZZLES.forEach((p, i) => { const b = document.createElement('button'); b.textContent = p.name; b.onclick = () => select(i); document.getElementById('nav').appendChild(b); });
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); PUZZLES[cur].down && PUZZLES[cur].down(e); });
cv.addEventListener('pointermove', e => PUZZLES[cur].move && PUZZLES[cur].move(e));
cv.addEventListener('pointerup', e => PUZZLES[cur].up && PUZZLES[cur].up(e));
document.addEventListener('keydown', e => { if (PUZZLES[cur].key && e.key.startsWith('Arrow')) e.preventDefault(); PUZZLES[cur].key && PUZZLES[cur].key(e.key); });
function loop(t) { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); PUZZLES[cur].draw(t); requestAnimationFrame(loop); }
function save() {
  cv.toBlob(blob => { const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = PUZZLES[cur].file + '.png';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); }, 'image/png');
}
select(0); requestAnimationFrame(loop);
</script>
</body>
</html>
